<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <section class="todoList-container">
    <div class="todoList">
      <h1>To-Do List</h1>

      <div class="row">
        <input class="task-input" type="text" placeholder="Add your text">
        <button onclick="addTask()">Add</button>
      </div>

      <ul class="tasks">
      </ul>

    </div>
  </section>
  <footer>
    <p>Desenvolvido por <a href="https://www.linkedin.com/in/celsotoledo1/">Celso Toledo</a></p>
  </footer>
  <div class="toastcontainer"></div>


  <script src="script.js"></script>
</body>

</html>
